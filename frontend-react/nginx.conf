server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers audio d'une heure : jusqu'à 200 Mo
    client_max_body_size 200m;

    # /api/... → service FastAPI (le préfixe /api est retiré)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;   # transcription longue
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
